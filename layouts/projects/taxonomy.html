{{- define "main" -}}
<div class="wrapper devlog-wide">
  <header class="header">
    <h1 class="header-title center">{{ .Title }}</h1>
    {{- with .Params.summary }}<p class="devlog-lede center">{{ . }}</p>{{ end }}
  </header>
  <main aria-label="Content">
    <div class="devlog-cards">
      {{- range partial "devlog/projects-ordered.html" . }}
      {{ partial "devlog/project-card.html" . }}
      {{- end }}
    </div>
    {{- with site.GetPage "/posts" }}
    <p class="devlog-more"><a href="{{ .RelPermalink }}">All articles ({{ len .RegularPages }}) →</a></p>
    {{- end }}
  </main>
</div>
{{- end -}}
