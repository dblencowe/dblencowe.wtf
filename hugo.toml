title = "dblencowe.wtf"
baseURL = 'https://dblencowe.wtf/'

# This is what goes in <html lang="">
languageCode = 'en-us'

# This defines how dates are formatted
defaultContentLanguage = "en-us"

# Enable emojis globally
enableEmoji = true
ignoreErrors = ["additional-script-loading-error"]

# Theme
theme = "hugo-blog-awesome"

# Dev log taxonomies (docs/specs/devlog.md D5). Defining these replaces Hugo's
# default tags and categories.
[taxonomies]
  project = "projects"
  skill = "skills"

# Publish only processed copies of images in articles and projects, never the
# originals (and their EXIF). Set here rather than in section front matter so it
# also reaches project term pages.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = "{/posts/**,/projects/**}"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  # Lets the image render hook output a <figure> for an image on its own line.
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

############################## English language ################################
[Languages.en-us]
  languageName = "English"
  languageCode = "en-us"
  weight = 1

  [Languages.en-us.menu]
  [[Languages.en-us.menu.main]]
    pageRef="/"
    name = 'Home'
    weight = 10
  [[Languages.en-us.menu.main]]
    pageRef="projects"
    name = 'Projects'
    weight = 20
  [[Languages.en-us.menu.main]]
    pageRef="skills"
    name = 'Skills'
    weight = 30
  [[Languages.en-us.menu.main]]
    pageRef="about"
    name = 'About'
    weight = 40

[Languages.en-us.params]
  sitename = "dblencowe.wtf"
  defaultColor = "auto" # set color mode: dark, light, auto
  description = "Dave Blencowe's dev log: write-ups of the infrastructure, software, games and workshop builds he works on."
  mainSections = ['posts']
  toc = true
  tocOpen = false
  goToTop = true
  dateFormat = ""
  rssFeedDescription = "summary"

[Languages.en-us.params.author]
  intro = "Dave Blencowe"
  name = "Dave Blencowe"
  email = "hi@dblencowe.wtf"  # public contact address, shown in the footer
  description = "Principal cyber security engineer in Manchester. Notes on what I build: infrastructure, software, games and the workshop."

[[Languages.en-us.params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/dblencowe"

[Languages.en-us.params.webmanifest]
  name = "dblencowe.wtf"
  short_name = "dblencowe.wtf"
  start_url = "/"
  theme_color = "#fcc753"
  background_color = "#fcc753"
  display = "standalone"

[params.browserconfig]
  TileColor = "#fcc753"
