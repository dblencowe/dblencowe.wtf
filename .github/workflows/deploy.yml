name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two applies against the same state at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with the image tags in compose.yaml.
  HUGO_VERSION: "0.166.0"
  TERRAFORM_VERSION: "1.16.2"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: Build
        run: hugo --gc --minify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: public/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      # Pull requests (and other branches) only plan; main applies and publishes.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_entry_role_arn: ${{ vars.AWS_ENTRY_ROLE_ARN }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # GitHub OIDC -> this repo's entry role (dblencowe-github-aws-infra) ->
      # the runner role in infra/github_runner.tf. Session tagging is skipped
      # because neither role's trust policy allows sts:TagSession.
      - name: Assume OIDC entry role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ENTRY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-entry-${{ github.run_id }}
          role-skip-session-tagging: true

      - name: Switch into runner role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-chaining: true
          role-session-name: gha-runner-${{ github.run_id }}
          role-skip-session-tagging: true

      - name: Init
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: terraform plan -no-color -out=tfplan

      - name: Apply
        if: env.PUBLISH == 'true'
        run: terraform apply -no-color tfplan

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.PUBLISH == 'true'
        with:
          name: site
          path: public

      - name: Publish to S3
        if: env.PUBLISH == 'true'
        run: |
          bucket="s3://$(terraform output -raw site_bucket)"
          # Assets first, then pages and feeds, so new HTML never links to a file
          # that isn't uploaded yet. Pages always revalidate with the edge, whose
          # copy is invalidated in the next step.
          aws s3 sync ../public "$bucket" --delete --no-progress \
            --exclude "*.html" --exclude "*.xml" --exclude "*.json" --exclude "*.txt" --exclude "*.webmanifest" \
            --cache-control "public, max-age=86400"
          aws s3 sync ../public "$bucket" --delete --no-progress \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.json" --include "*.txt" --include "*.webmanifest" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        if: env.PUBLISH == 'true'
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$(terraform output -raw cloudfront_distribution_id)"
          --paths "/*"
          --query Invalidation.Id
          --output text
