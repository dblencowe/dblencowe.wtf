# The fixed skills vocabulary (docs/specs/devlog.md D7).
# An article's `skills` must use slugs from this list; the build fails otherwise.
# Add a skill here in the same change as the first article that needs it.
domains:
  infra: "Cloud & infra"
  game: "Game dev"
  soft: "Software"
  make: "Making"

# Order of domains on the skills page.
domainOrder: [infra, game, soft, make]

